<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0D63F3" />
<title>HS Height — Hostel Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HS HEIGHT — DESIGN TOKENS
   ============================================================ */
:root{
  --blue:#0D63F3;
  --blue-dark:#0A4FC4;
  --blue-50:#EAF1FE;
  --blue-100:#DCE8FE;
  --navy:#0B1235;
  --muted:#5F6F91;
  --bg:#F8FAFD;
  --line:#E4EAF5;
  --card:#FFFFFF;

  --green:#12A150;
  --green-bg:#E7F7EE;
  --red:#E5484D;
  --red-bg:#FDECEC;
  --amber:#C97A00;
  --amber-bg:#FFF4E0;
  --purple:#7C5CFC;
  --purple-bg:#F1EDFE;

  --r-card:18px;
  --r-btn:14px;
  --r-pill:999px;
  --shadow:0 1px 2px rgba(11,18,53,.04), 0 4px 14px rgba(11,18,53,.045);
  --shadow-sm:0 1px 2px rgba(11,18,53,.05);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--navy);
  width:100%;
  min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.4;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;padding:0;}
input,select,textarea{outline:none;}
a{color:var(--blue);text-decoration:none;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px;}

#app{width:100%;min-height:100dvh;display:flex;flex-direction:column;}
.shell{display:flex;flex-direction:column;min-height:100dvh;width:100%;}

/* ============================================================
   TOP BAR
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:#fff;
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
  padding-top:calc(12px + env(safe-area-inset-top));
}
.icon-btn{
  width:42px;height:42px;min-width:42px;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;color:var(--navy);
  transition:background .15s;
}
.icon-btn:active{background:var(--blue-50);}
.brand{flex:1;font-size:19px;font-weight:800;letter-spacing:-.3px;}
.brand .b1{color:var(--navy);}
.brand .b2{color:var(--blue);}
.brand-sub{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:600;}

/* ============================================================
   CONTENT
   ============================================================ */
.content{flex:1;width:100%;padding:16px 16px 110px;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;}
.page-title{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:0;display:flex;align-items:center;gap:8px;}
.page-sub{font-size:13.5px;color:var(--muted);margin:4px 0 0;}
.count-badge{
  background:var(--blue-50);color:var(--blue);font-size:13px;font-weight:700;
  padding:2px 10px;border-radius:var(--r-pill);
}
.section-title{font-size:16px;font-weight:700;margin:0;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.link{color:var(--blue);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;}

/* ============================================================
   CARDS
   ============================================================ */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  padding:16px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}
.card.flush{padding:0;overflow:hidden;}
.card.tint-blue{background:linear-gradient(180deg,#F4F8FF,#FFFFFF);border-color:#DCE8FE;}
.card.tint-red{background:linear-gradient(180deg,#FFF3F3,#FFFFFF);border-color:#FBDCDC;}
.card.tint-green{background:linear-gradient(180deg,#F1FBF5,#FFFFFF);border-color:#D7F0E1;}
.card.tint-amber{background:linear-gradient(180deg,#FFF9EE,#FFFFFF);border-color:#FBE6C2;}
.card.tint-purple{background:linear-gradient(180deg,#F7F4FF,#FFFFFF);border-color:#E3DBFE;}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 18px;border-radius:var(--r-btn);
  font-weight:700;font-size:15px;
  transition:transform .08s, background .15s, opacity .15s;
  border:1px solid transparent;
}
.btn:active{transform:scale(.975);}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(13,99,243,.25);}
.btn-primary:active{background:var(--blue-dark);}
.btn-ghost{background:#fff;color:var(--blue);border-color:var(--blue-100);}
.btn-soft{background:var(--blue-50);color:var(--blue);}
.btn-danger{background:var(--red);color:#fff;}
.btn-danger-soft{background:var(--red-bg);color:var(--red);}
.btn-success-soft{background:var(--green-bg);color:var(--green);}
.btn-warn-soft{background:var(--amber-bg);color:var(--amber);}
.btn-block{width:100%;}
.btn-sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:12px;}
.btn[disabled]{opacity:.5;pointer-events:none;}
.btn-row{display:flex;gap:10px;}
.btn-row>.btn{flex:1;}

/* ============================================================
   PILLS / STATUS
   ============================================================ */
.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:700;
  padding:5px 11px;border-radius:var(--r-pill);
  white-space:nowrap;
}
.pill-paid,.pill-resolved{background:var(--green-bg);color:var(--green);}
.pill-unpaid,.pill-open{background:var(--red-bg);color:var(--red);}
.pill-partial,.pill-in-progress{background:var(--amber-bg);color:var(--amber);}
.pill-info{background:var(--blue-50);color:var(--blue);}
.pill-elec{background:var(--amber-bg);color:var(--amber);}
.pill-neutral{background:#F1F4FA;color:var(--muted);}

/* ============================================================
   CHIPS / FILTERS
   ============================================================ */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;
  padding:9px 16px;border-radius:var(--r-pill);
  background:#F1F4FA;color:var(--muted);
  font-weight:600;font-size:13.5px;min-height:40px;
  display:inline-flex;align-items:center;gap:6px;
  transition:background .15s,color .15s;
}
.chip.active{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(13,99,243,.25);}

/* ============================================================
   SEARCH
   ============================================================ */
.search{
  display:flex;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:0 14px;height:50px;margin-bottom:12px;
  color:var(--muted);
  box-shadow:var(--shadow-sm);
}
.search input{flex:1;border:none;background:none;height:100%;font-size:14.5px;color:var(--navy);}
.search input::placeholder{color:#9AA7C0;}

/* ============================================================
   AVATARS
   ============================================================ */
.avatar{
  width:46px;height:46px;min-width:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;letter-spacing:.3px;
}
.avatar.sm{width:34px;height:34px;min-width:34px;font-size:12px;}
.avatar.lg{width:76px;height:76px;min-width:76px;font-size:26px;}

/* ============================================================
   LIST ROWS
   ============================================================ */
.list{display:flex;flex-direction:column;}
.row{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;background:#fff;
  border-bottom:1px solid var(--line);
  width:100%;text-align:left;
}
.row:last-child{border-bottom:none;}
.row:active{background:#F7FAFF;}
.row-main{flex:1;min-width:0;}
.row-title{font-weight:700;font-size:14.5px;color:var(--navy);display:flex;align-items:center;gap:6px;}
.row-sub{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.row-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.amount{font-weight:800;font-size:15px;}
.amount.due{color:var(--red);}
.amount.paid{color:var(--green);}
.amount.muted{color:var(--muted);font-weight:600;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ============================================================
   STAT / FINANCIAL CARDS
   ============================================================ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.grid2.tight{gap:10px;}
.stat{
  border-radius:var(--r-card);border:1px solid var(--line);
  background:#fff;padding:14px;box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;gap:6px;text-align:left;
}
.stat-label{font-size:12.5px;color:var(--muted);font-weight:600;}
.stat-value{font-size:21px;font-weight:800;letter-spacing:-.5px;}
.stat-foot{font-size:11.5px;color:var(--muted);}
.stat-icon{
  width:38px;height:38px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;margin-bottom:2px;
}
.stat.big{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;padding:18px;}
.stat.big .stat-value{font-size:32px;}
.bg-blue{background:var(--blue-50);color:var(--blue);}
.bg-green{background:var(--green-bg);color:var(--green);}
.bg-red{background:var(--red-bg);color:var(--red);}
.bg-amber{background:var(--amber-bg);color:var(--amber);}
.bg-purple{background:var(--purple-bg);color:var(--purple);}

.kv{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.kv:last-child{border-bottom:none;}
.kv-icon{width:34px;height:34px;min-width:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#F3F6FC;color:var(--muted);}
.kv-label{font-size:12.5px;color:var(--muted);font-weight:600;}
.kv-value{font-size:14.5px;font-weight:600;color:var(--navy);margin-top:1px;}

/* ============================================================
   FORMS
   ============================================================ */
.field{margin-bottom:16px;}
.field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:7px;}
.field .req{color:var(--red);}
.field .hint{font-size:12px;color:var(--muted);margin-top:6px;}
.input-wrap{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--line);border-radius:14px;background:#fff;
  padding:0 14px;height:52px;color:var(--muted);
  transition:border-color .15s, box-shadow .15s;
}
.input-wrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(13,99,243,.12);}
.input-wrap input,.input-wrap select,.input-wrap textarea{
  flex:1;border:none;background:none;height:100%;font-size:15px;color:var(--navy);width:100%;
  appearance:none;-webkit-appearance:none;
}
.input-wrap.textarea{height:auto;padding:12px 14px;align-items:flex-start;}
.input-wrap textarea{min-height:92px;resize:vertical;line-height:1.45;padding-top:2px;}
.input-wrap select{cursor:pointer;background:transparent;}
.select-wrap{position:relative;}
.select-wrap .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);}
.err{color:var(--red);font-size:12.5px;margin-top:6px;font-weight:600;}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:stretch;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -2px 16px rgba(11,18,53,.05);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;border-radius:14px;color:#6B7A99;
  font-size:11.5px;font-weight:600;min-height:56px;justify-content:center;
  transition:background .15s,color .15s;
}
.nav-item.active{color:var(--blue);background:var(--blue-50);}
.nav-item.active span{font-weight:700;}

/* ============================================================
   DRAWER
   ============================================================ */
.drawer-backdrop{
  position:fixed;inset:0;background:rgba(11,18,53,.45);z-index:200;
  animation:fadeIn .18s ease;display:flex;
}
.drawer{
  width:82%;max-width:330px;height:100%;background:#fff;
  padding:calc(20px + env(safe-area-inset-top)) 16px 20px;
  overflow-y:auto;animation:slideRight .25s cubic-bezier(.16,1,.3,1);
  border-radius:0 22px 22px 0;
}
.drawer-head{display:flex;align-items:center;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:12px;}
.drawer-link{
  display:flex;align-items:center;gap:13px;width:100%;
  padding:13px 10px;border-radius:13px;font-weight:600;font-size:15px;color:var(--navy);
  text-align:left;
}
.drawer-link:active{background:var(--blue-50);}
.drawer-link .di{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;}

/* ============================================================
   BOTTOM SHEET / MODAL
   ============================================================ */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(11,18,53,.5);z-index:300;
  display:flex;align-items:flex-end;animation:fadeIn .18s ease;
}
.sheet{
  width:100%;background:#fff;border-radius:26px 26px 0 0;
  max-height:94dvh;overflow-y:auto;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
  -webkit-overflow-scrolling:touch;
}
.drag-handle{width:42px;height:5px;border-radius:99px;background:#D9E0EE;margin:0 auto 14px;}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;}
.sheet-title{font-size:21px;font-weight:800;letter-spacing:-.4px;margin:0;}
.sheet-sub{font-size:13.5px;color:var(--muted);margin:3px 0 0;}
.close-btn{
  margin-left:auto;width:38px;height:38px;min-width:38px;border-radius:50%;
  background:#F1F4FA;color:var(--muted);display:flex;align-items:center;justify-content:center;
}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(11,18,53,.5);z-index:400;
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fadeIn .18s ease;
}
.modal{
  background:#fff;border-radius:22px;padding:22px;width:100%;max-width:360px;
  animation:popIn .2s cubic-bezier(.16,1,.3,1);
}
.modal h3{margin:0 0 8px;font-size:19px;font-weight:800;}
.modal p{margin:0 0 20px;color:var(--muted);font-size:14px;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideRight{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.screen-anim{animation:slideIn .2s ease;}

/* ============================================================
   TOASTS
   ============================================================ */
#toast-root{
  position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));
  z-index:600;display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;padding:0 16px;
}
.toast{
  display:flex;align-items:center;gap:10px;
  background:#0B1235;color:#fff;
  padding:13px 18px;border-radius:14px;
  font-size:14px;font-weight:600;
  box-shadow:0 8px 26px rgba(11,18,53,.28);
  animation:slideIn .22s ease;
  max-width:100%;
}
.toast.success{background:#0E7A3E;}
.toast.error{background:#C42B30;}
.toast.info{background:#0B1235;}

/* ============================================================
   LOGIN
   ============================================================ */
.login{
  min-height:100dvh;width:100%;
  background:linear-gradient(180deg,#E8F1FE 0%,#F5F9FF 42%,#FFFFFF 62%);
  display:flex;flex-direction:column;align-items:center;
  padding:calc(38px + env(safe-area-inset-top)) 22px calc(24px + env(safe-area-inset-bottom));
  position:relative;overflow:hidden;
}
.login-deco{
  position:absolute;left:-40px;right:-40px;bottom:0;height:180px;
  background:radial-gradient(120% 100% at 50% 100%, #DCEBFF 0%, rgba(220,235,255,0) 70%);
  pointer-events:none;
}
.login-logo{width:96px;height:96px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(13,99,243,.18);font-size:34px;font-weight:800;color:var(--blue);letter-spacing:-2px;}
.login-brand{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:16px;}
.login-brand .b1{color:var(--navy);}
.login-brand .b2{color:var(--blue);}
.login-tag{font-size:10.5px;letter-spacing:3.4px;color:var(--muted);font-weight:700;margin-top:6px;}
.login-card{
  width:100%;background:#fff;border-radius:26px;padding:26px 20px;
  box-shadow:0 12px 40px rgba(11,18,53,.08);
  border:1px solid var(--line);
  margin-top:auto;position:relative;z-index:2;
}
.login-card h1{font-size:27px;font-weight:800;letter-spacing:-.7px;margin:0;text-align:center;}
.login-card p.sub{font-size:14px;color:var(--muted);text-align:center;margin:7px 0 22px;}
.secure{
  display:flex;align-items:center;gap:10px;justify-content:center;
  margin-top:18px;font-size:12.5px;color:var(--muted);text-align:center;
}
.secure .lock{width:34px;height:34px;min-width:34px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:flex;align-items:center;justify-content:center;}

/* ============================================================
   MISC
   ============================================================ */
.empty{
  text-align:center;padding:44px 20px;color:var(--muted);
}
.empty .ic-wrap{
  width:64px;height:64px;border-radius:50%;background:var(--blue-50);color:var(--blue);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
}
.empty h4{margin:0 0 6px;font-size:16px;color:var(--navy);font-weight:700;}
.empty p{margin:0;font-size:13.5px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.month-selector{
  display:flex;align-items:center;gap:8px;justify-content:center;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-pill);
  padding:6px 8px;margin:0 auto 16px;width:fit-content;box-shadow:var(--shadow-sm);
}
.month-selector button{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.month-selector button:active{background:var(--blue-50);color:var(--blue);}
.month-label{font-weight:700;font-size:14.5px;padding:0 4px;min-width:130px;text-align:center;}
.occ-dots{display:flex;gap:5px;margin-top:6px;}
.dot{width:22px;height:8px;border-radius:99px;background:#E2E8F4;}
.dot.on{background:var(--green);}
.occ-people{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.occ-chip{display:inline-flex;align-items:center;gap:5px;background:#F5F8FD;border-radius:99px;padding:3px 9px 3px 3px;font-size:11.5px;font-weight:600;color:#3C4A6B;}
.tabs{display:flex;background:#EFF3FA;border-radius:14px;padding:4px;margin-bottom:14px;}
.tab{flex:1;text-align:center;padding:11px 0;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted);}
.tab.active{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(13,99,243,.22);}
.table-head{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  background:#F5F8FD;font-size:11.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;
}
.timeline{position:relative;padding-left:30px;}
.tl-item{position:relative;padding-bottom:20px;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{
  content:'';position:absolute;left:-22px;top:14px;bottom:-6px;width:2px;background:var(--line);
}
.tl-item:last-child::before{display:none;}
.tl-dot{
  position:absolute;left:-29px;top:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:2px solid #D5DEEE;
}
.tl-item.done .tl-dot{background:var(--blue);border-color:var(--blue);}
.tl-item.active .tl-dot{background:var(--red);border-color:var(--red);box-shadow:0 0 0 4px rgba(229,72,77,.14);}
.tl-title{font-weight:700;font-size:14.5px;}
.tl-sub{font-size:12.5px;color:var(--muted);margin-top:2px;}
.img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.img-ph{
  aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,#DCE8FE,#C9DCFB);
  display:flex;align-items:center;justify-content:center;color:var(--blue);

/* ----------------------------------------------------------------
   5. HELPERS
   ---------------------------------------------------------------- */
function money(n){
  const v = Math.round((Number(n)||0) * 100) / 100;
  return '\u20B9' + v.toLocaleString('en-IN', { maximumFractionDigits:2 });
}
function moneyShort(n){ return money(n); }
function r2(n){ return Math.round((Number(n)||0)*100)/100; }

function monthLabel(ym){
  const p = ym.split('-');
  return MONTH_NAMES[parseInt(p[1],10)-1] + ' ' + p[0];
}
function monthLabelShort(ym){
  const p = ym.split('-');
  return MONTH_SHORT[parseInt(p[1],10)-1] + ' ' + p[0];
}
function shiftMonth(ym, delta){
  const p = ym.split('-');
  let y = parseInt(p[0],10), m = parseInt(p[1],10) + delta;
  while(m > 12){ m -= 12; y++; }
  while(m < 1){ m += 12; y--; }
  return y + '-' + String(m).padStart(2,'0');
}
function dateLabel(iso){
  if(!iso) return '';
  const p = iso.split('-');
  if(p.length < 3) return iso;
  return parseInt(p[2],10) + ' ' + MONTH_SHORT[parseInt(p[1],10)-1] + ' ' + p[0];
}
function dateTimeLabel(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const hh = d.getHours(); const mm = String(d.getMinutes()).padStart(2,'0');
  const ampm = hh >= 12 ? 'PM' : 'AM';
  const h12 = hh % 12 === 0 ? 12 : hh % 12;
  return d.getDate() + ' ' + MONTH_SHORT[d.getMonth()] + ' ' + d.getFullYear() + ', ' + h12 + ':' + mm + ' ' + ampm;
}
function relTime(iso){
  const d = new Date(iso); if(isNaN(d)) return '';
  const diff = (new Date('2026-10-15T13:00:00') - d) / 3600000;
  if(diff < 1) return 'Just now';
  if(diff < 24) return Math.round(diff) + ' hours ago';
  return Math.round(diff/24) + ' days ago';
}
function initials(name){
  const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length === 1) return parts[0].substring(0,2).toUpperCase();
  return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
}
const AVATAR_TONES = [
  ['#EAF1FE','#0D63F3'], ['#E7F7EE','#12A150'], ['#FDECEC','#E5484D'],
  ['#FFF4E0','#C97A00'], ['#F1EDFE','#7C5CFC'], ['#E6F7FA','#0E8FA8'],
  ['#FDEBF6','#C2187A']
];
function toneFor(str){
  let h = 0;
  for(let i=0;i<String(str).length;i++){ h = (h*31 + String(str).charCodeAt(i)) % 997; }
  return AVATAR_TONES[h % AVATAR_TONES.length];
}
function avatar(name, cls){
  const t = toneFor(name);
  return '<div class="avatar '+(cls||'')+'" style="background:'+t[0]+';color:'+t[1]+'">'+initials(name)+'</div>';
}
function statusPill(status){
  const map = {
    paid:['pill-paid','Paid'],
    unpaid:['pill-unpaid','Unpaid'],
    partial:['pill-partial','Partial'],
    open:['pill-open','Open'],
    'in-progress':['pill-in-progress','In Progress'],
    resolved:['pill-resolved','Resolved']
  };
  const m = map[status] || ['pill-neutral', status];
  return '<span class="pill '+m[0]+'">'+m[1]+'</span>';
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

/* ----------------------------------------------------------------
   6. LOOKUPS
   ---------------------------------------------------------------- */
function getTenant(id){ return DB.tenants.find(function(t){ return t.id===id; }); }
function getRoom(id){ return DB.rooms.find(function(r){ return r.id===id; }); }
function getRoomByNumber(num){ return DB.rooms.find(function(r){ return r.roomNumber===String(num); }); }
function roomOccupants(roomId){ return DB.tenants.filter(function(t){ return t.roomId===roomId; }); }
function getComplaint(id){ return DB.complaints.find(function(c){ return c.id===id; }); }

function elecRecord(roomId, month){
  return DB.electricity.find(function(e){ return e.roomId===roomId && e.month===month; });
}
function elecBillFor(roomId, month){
  const rec = elecRecord(roomId, month);
  return rec ? rec.totalBill : 0;
}
function elecShareFor(tenant, month){
  const occ = roomOccupants(tenant.roomId).length;
  if(!occ) return 0;
  return r2(elecBillFor(tenant.roomId, month) / occ);
}

/* ----------------------------------------------------------------
   7. CALCULATIONS (single source of truth)
   ---------------------------------------------------------------- */
function rentPaidFor(tenantId, month){
  return r2(DB.payments
    .filter(function(p){ return p.tenantId===tenantId && p.month===month && p.type==='rent'; })
    .reduce(function(s,p){ return s + p.amount; }, 0));
}
function elecPaidFor(tenantId, month){
  return r2(DB.payments
    .filter(function(p){ return p.tenantId===tenantId && p.month===month && p.type==='electricity'; })
    .reduce(function(s,p){ return s + p.amount; }, 0));
}
function calculateRentDue(tenant, month){
  return Math.max(0, r2(tenant.monthlyRent - rentPaidFor(tenant.id, month)));
}
function calculateElectricityDue(tenant, month){
  return Math.max(0, r2(elecShareFor(tenant, month) - elecPaidFor(tenant.id, month)));
}
function calculateTenantStatus(paid, expected){
  if(paid <= 0) return 'unpaid';
  if(paid < expected - 0.009) return 'partial';
  return 'paid';
}
function tenantRentStatus(tenant, month){
  return calculateTenantStatus(rentPaidFor(tenant.id, month), tenant.monthlyRent);
}
function tenantElecStatus(tenant, month){
  const share = elecShareFor(tenant, month);
  if(share <= 0) return 'paid';
  return calculateTenantStatus(elecPaidFor(tenant.id, month), share);
}
function tenantTotalDue(tenant, month){
  return r2(calculateRentDue(tenant, month) + calculateElectricityDue(tenant, month));
}
function tenantTotalStatus(tenant, month){
  if(tenantTotalDue(tenant, month) <= 0) return 'paid';
  const paidAny = rentPaidFor(tenant.id, month) > 0 || elecPaidFor(tenant.id, month) > 0;
  return paidAny ? 'partial' : 'unpaid';
}

function calculateRoomFinancials(roomId, month){
  const occ = roomOccupants(roomId);
  const totalRent = r2(occ.reduce(function(s,t){ return s + t.monthlyRent; }, 0));
  const rentCollected = r2(occ.reduce(function(s,t){ return s + rentPaidFor(t.id, month); }, 0));
  const rentOutstanding = Math.max(0, r2(totalRent - rentCollected));
  const elecBill = elecBillFor(roomId, month);
  const elecCollected = r2(occ.reduce(function(s,t){ return s + elecPaidFor(t.id, month); }, 0));
  const elecOutstanding = Math.max(0, r2(elecBill - elecCollected));
  const share = occ.length ? r2(elecBill / occ.length) : 0;
  return {
    occupants: occ.length,
    totalRent: totalRent,
    rentCollected: rentCollected,
    rentOutstanding: rentOutstanding,
    elecBill: elecBill,
    elecCollected: elecCollected,
    elecOutstanding: elecOutstanding,
    elecShare: share,
    capacity: getRoom(roomId) ? getRoom(roomId).capacity : 3
  };
}

function calculateDashboardTotals(month){
  const tenants = DB.tenants;
  const expectedRent = r2(tenants.reduce(function(s,t){ return s + t.monthlyRent; }, 0));
  const rentCollected = r2(DB.payments
    .filter(function(p){ return p.month===month && p.type==='rent'; })
    .reduce(function(s,p){ return s + p.amount; }, 0));
  const rentDue = Math.max(0, r2(expectedRent - rentCollected));

  const elecBill = r2(DB.electricity
    .filter(function(e){ return e.month===month; })
    .reduce(function(s,e){ return s + e.totalBill; }, 0));
  const elecCollected = r2(DB.payments
    .filter(function(p){ return p.month===month && p.type==='electricity'; })
    .reduce(function(s,p){ return s + p.amount; }, 0));
  const elecDue = Math.max(0, r2(elecBill - elecCollected));

  const occupiedRooms = DB.rooms.filter(function(r){ return roomOccupants(r.id).length > 0; }).length;

  const dueTenants = tenants.filter(function(t){ return tenantTotalDue(t, month) > 0; }).length;
  const rentDueTenants = tenants.filter(function(t){ return calculateRentDue(t, month) > 0; }).length;
  const elecDueTenants = tenants.filter(function(t){ return calculateElectricityDue(t, month) > 0; }).length;

  return {
    expectedRent: expectedRent,
    rentCollected: rentCollected,
    rentDue: rentDue,
    elecBill: elecBill,
    elecCollected: elecCollected,
    elecDue: elecDue,
    totalTenants: tenants.length,
    occupiedRooms: occupiedRooms,
    totalRooms: DB.rooms.length,
    dueTenants: dueTenants,
    rentDueTenants: rentDueTenants,
    elecDueTenants: elecDueTenants,
    totalOutstanding: r2(rentDue + elecDue)
  };
}

/* ----------------------------------------------------------------
   8. NAVIGATION
   ---------------------------------------------------------------- */
function navigate(screen, params, opts){
  opts = opts || {};
  if(!opts.replace && UI.screen !== screen){
    UI.stack.push({ screen:UI.screen, params:UI.params });
    if(UI.stack.length > 40) UI.stack.shift();
  }
  UI.screen = screen;
  UI.params = params || {};
  window.scrollTo(0,0);
  render();
}
function back(){
  const prev = UI.stack.pop();
  if(prev){ UI.screen = prev.screen; UI.params = prev.params; }
  else { UI.screen = 'home'; UI.params = {}; }
  window.scrollTo(0,0);
  render();
}
function currentTab(){
  const s = UI.screen;
  if(s === 'home') return 'home';
  if(s.indexOf('tenant') === 0) return 'tenants';
  if(s === 'rent' || s === 'electricity' || s === 'electricity-details' || s === 'financial') return 'rent';
  return 'more';
}

function showToast(msg, type){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || 'info');
  let ic = 'info';
  if(type === 'success') ic = 'checkCircle';
  if(type === 'error') ic = 'alert';
  el.innerHTML = icon(ic,18) + '<span>' + esc(msg) + '</span>';
  root.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(function(){ el.remove(); }, 260);
  }, 2400);
}

let confirmResolver = null;
function confirmDialog(title, message, confirmLabel, danger){
  const root = document.getElementById('sheet-root');
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.innerHTML =
    '<div class="modal" role="dialog" aria-modal="true">' +
      '<h3>' + esc(title) + '</h3>' +
      '<p>' + esc(message) + '</p>' +
      '<div class="btn-row">' +
        '<button class="btn btn-ghost" data-confirm="0">Cancel</button>' +
        '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-confirm="1">' + esc(confirmLabel||'Confirm') + '</button>' +
      '</div>' +
    '</div>';
  root.appendChild(wrap);
  wrap.addEventListener('click', function(e){
    const btn = e.target.closest('[data-confirm]');
    if(!btn && e.target !== wrap) return;
    const val = btn ? btn.dataset.confirm === '1' : false;
    wrap.remove();
    if(confirmResolver) confirmResolver(val);
    confirmResolver = null;
  });
}

function tenantMatchesSearch(t, q){
  if(!q) return true;
  q = q.toLowerCase();
  const room = getRoom(t.roomId);
  return t.name.toLowerCase().indexOf(q) >= 0 ||
         t.phone.toLowerCase().indexOf(q) >= 0 ||
         (room && room.roomNumber.indexOf(q) >= 0);
}

function renderTenants(){
  const m = UI.month;
  let list = DB.tenants.slice().sort(function(a,b){
    const ra = getRoom(a.roomId), rb = getRoom(b.roomId);
    const na = ra ? parseInt(ra.roomNumber,10) : 0;
    const nb = rb ? parseInt(rb.roomNumber,10) : 0;
    if(na !== nb) return na - nb;
    return a.name.localeCompare(b.name);
  });

  const total = list.length;
  list = list.filter(function(t){ return tenantMatchesSearch(t, UI.tenantSearch); });

  if(UI.tenantFilter === 'due'){
    list = list.filter(function(t){ return tenantTotalDue(t, m) > 0; });
  } else if(UI.tenantFilter === 'paid'){
    list = list.filter(function(t){ return tenantTotalDue(t, m) <= 0; });
  }

  const dueCount = DB.tenants.filter(function(t){ return tenantTotalDue(t, m) > 0; }).length;
  const paidCount = total - dueCount;

  let h = '';
  h += '<div class="page-head">' +
      '<div><h1 class="page-title">Tenants <span class="count-badge">' + total + '</span></h1>' +
      '<p class="page-sub">Manage all tenants living in your hostel</p></div>' +
      '<button class="btn btn-primary btn-sm" data-action="go" data-screen="tenant-add">' + icon('plus',16) + ' Add Tenant</button>' +
    '</div>';

  h += '<div class="search">' + icon('search',18) +
      '<input type="search" placeholder="Search tenant or mobile number..." value="' + esc(UI.tenantSearch) + '" data-search="tenantSearch" aria-label="Search tenants">' +
    '</div>';

  h += '<div class="chip-row">' +
      '<button class="chip' + (UI.tenantFilter==='all'?' active':'') + '" data-action="filter" data-group="tenantFilter" data-value="all">All (' + total + ')</button>' +
      '<button class="chip' + (UI.tenantFilter==='due'?' active':'') + '" data-action="filter" data-group="tenantFilter" data-value="due">Due (' + dueCount + ')</button>' +
      '<button class="chip' + (UI.tenantFilter==='paid'?' active':'') + '" data-action="filter" data-group="tenantFilter" data-value="paid">Paid (' + paidCount + ')</button>' +
      '<button class="chip" data-action="noop">' + icon('filter',15) + '</button>' +
    '</div>';

  if(!list.length){
    h += '<div class="card"><div class="empty">' +
      '<div class="ic-wrap">' + icon('users',26) + '</div>' +
      '<h4>' + (DB.tenants.length ? 'No tenants match your search.' : 'No tenants found.') + '</h4>' +
      '<p>Try a different name, mobile number or room.</p>' +
    '</div></div>';
    return h;
  }

  h += '<div class="card flush"><div class="list">';
  list.forEach(function(t){
    const room = getRoom(t.roomId);
    const rentDue = calculateRentDue(t, m);
    const elecDue = calculateElectricityDue(t, m);

/* ----------------------------------------------------------------

   ---------------------------------------------------------------- */
function renderRooms(){
  const m = UI.month;
  const rooms = DB.rooms.slice().sort(function(a,b){ return parseInt(a.roomNumber,10)-parseInt(b.roomNumber,10); });
  const totalTenants = DB.tenants.length;

  let list = rooms.filter(function(r){
    if(!UI.roomSearch) return true;
    return r.roomNumber.indexOf(UI.roomSearch.toLowerCase()) >= 0;
  });
  if(UI.roomFilter === 'occupied') list = list.filter(function(r){ return roomOccupants(r.id).length > 0; });
  if(UI.roomFilter === 'available') list = list.filter(function(r){ return roomOccupants(r.id).length < r.capacity; });

  const occupiedCount = rooms.filter(function(r){ return roomOccupants(r.id).length > 0; }).length;
  const availableCount = rooms.length - occupiedCount;

  let h = '';
  h += '<div class="page-head">' +
    '<div><h1 class="page-title">Rooms <span class="count-badge">' + rooms.length + '</span></h1>' +
    '<p class="page-sub">' + rooms.length + ' rooms &bull; ' + totalTenants + ' tenants</p></div>' +
    '<button class="btn btn-primary btn-sm" data-action="go" data-screen="room-add">' + icon('plus',16) + ' Add Room</button>' +
  '</div>';

  h += '<div class="search">' + icon('search',18) +
    '<input type="search" placeholder="Search room number..." value="' + esc(UI.roomSearch) + '" data-search="roomSearch" aria-label="Search rooms">' +
  '</div>';

  h += '<div class="chip-row">' +
    '<button class="chip' + (UI.roomFilter==='all'?' active':'') + '" data-action="filter" data-group="roomFilter" data-value="all">All (' + rooms.length + ')</button>' +
    '<button class="chip' + (UI.roomFilter==='occupied'?' active':'') + '" data-action="filter" data-group="roomFilter" data-value="occupied">Occupied (' + occupiedCount + ')</button>' +

    '<button class="chip" data-action="noop">' + icon('filter',15) + '</button>' +

  if(!list.length){
    h += '<div class="card"><div class="empty"><div class="ic-wrap">' + icon('bed',26) + '</div>' +
      '<h4>No rooms found.</h4><p>Try a different room number or filter.</p></div></div>';
    return h;

  h += '<div class="card flush"><div class="list">';
  list.forEach(function(r){
    const occ = roomOccupants(r.id);

      '<div class="row-main">' +
        '<div class="row-title">Room ' + esc(r.roomNumber) + '</div>' +
        '<div class="row-sub">' + occ.length + ' / ' + r.capacity + ' tenants</div>' +
        '<div class="occ-dots">' + dots + '</div>' +
      '</div>' +
      '<div class="row-right" style="min-width:96px">' +
        '<div style="font-size:11px;color:var(--muted);font-weight:600">Monthly Rent</div>' +
        '<div class="amount">' + money(r.monthlyRent) + '</div>' +
        '<div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:4px">Outstanding</div>' +

  });
  h += '</div></div>';
  return h;

function renderFinancialRecords(){
  const m = UI.month;

  let pays = DB.payments.filter(function(p){ return p.month === m && p.type === (tab === 'rent' ? 'rent' : 'electricity'); });

    if(UI.finTenant !== 'all' && p.tenantId !== UI.finTenant) return false;
    if(UI.finRoom !== 'all' && p.roomId !== UI.finRoom) return false;
    if(UI.finStatus !== 'all'){

      if(!t) return false;
      const expected = tab === 'rent' ? t.monthlyRent : elecShareFor(t, m);
      const paidAll = tab === 'rent' ? rentPaidFor(t.id, m) : elecPaidFor(t.id, m);

/* ----------------------------------------------------------------

function renderComplaints(){
  let list = DB.complaints.slice().sort(function(a,b){ return b.createdAt.localeCompare(a.createdAt); });
  const all = list.length;
  const openCount = DB.complaints.filter(function(c){ return c.status==='open'; }).length;
  const progCount = DB.complaints.filter(function(c){ return c.status==='in-progress'; }).length;
  const resCount = DB.complaints.filter(function(c){ return c.status==='resolved'; }).length;

  if(UI.complaintSearch){
    const q = UI.complaintSearch.toLowerCase();
    list = list.filter(function(c){
      const t = getTenant(c.tenantId);
      const room = getRoom(c.roomId);
      return c.title.toLowerCase().indexOf(q) >= 0 ||
        (t && t.name.toLowerCase().indexOf(q) >= 0) ||
        (room && room.roomNumber.indexOf(q) >= 0);
    });
  }
  if(UI.complaintFilter !== 'all'){
    list = list.filter(function(c){ return c.status === UI.complaintFilter; });
  }

  let h = '';
  h += '<div class="page-head">' +
    '<div><h1 class="page-title">Complaints <span class="count-badge">' + all + '</span></h1>' +
    '<p class="page-sub">Manage and track all tenant complaints</p></div>' +
    '<button class="btn btn-primary btn-sm" data-action="go" data-screen="complaint-add">' + icon('plus',16) + ' Add</button>' +
  '</div>';

  h += '<div class="search">' + icon('search',18) +
    '<input type="search" placeholder="Search by complaint, tenant or room number..." value="' + esc(UI.complaintSearch) + '" data-search="complaintSearch" aria-label="Search complaints">' +
  '</div>';

  h += '<div class="chip-row">' +
    '<button class="chip' + (UI.complaintFilter==='all'?' active':'') + '" data-action="filter" data-group="complaintFilter" data-value="all">All (' + all + ')</button>' +
    '<button class="chip' + (UI.complaintFilter==='open'?' active':'') + '" data-action="filter" data-group="complaintFilter" data-value="open">Open (' + openCount + ')</button>' +
    '<button class="chip' + (UI.complaintFilter==='in-progress'?' active':'') + '" data-action="filter" data-group="complaintFilter" data-value="in-progress">In Progress (' + progCount + ')</button>' +
    '<button class="chip' + (UI.complaintFilter==='resolved'?' active':'') + '" data-action="filter" data-group="complaintFilter" data-value="resolved">Resolved (' + resCount + ')</button>' +
  '</div>';

  if(!list.length){
    h += '<div class="card"><div class="empty"><div class="ic-wrap">' + icon('wrench',26) + '</div>' +
      '<h4>No complaints found</h4><p>All quiet on the hostel front.</p></div></div>';
    return h;
  }

  h += '<div class="card flush"><div class="list">';
  list.forEach(function(c){
    const t = getTenant(c.tenantId);
    const room = getRoom(c.roomId);
    const tone = c.status==='open' ? 'bg-red' : (c.status==='in-progress' ? 'bg-amber' : 'bg-green');
    h += '<button class="row" data-action="go" data-screen="complaint-details" data-id="' + c.id + '">' +
      '<div class="stat-icon ' + tone + '" style="width:44px;height:44px;margin:0">' + icon(c.icon||'wrench',20) + '</div>' +
      '<div class="row-main">' +
        '<div class="row-title truncate">' + esc(c.title) + '</div>' +
        '<div class="row-sub">' + icon('user',13) + ' ' + esc(t ? t.name : '-') + '</div>' +
        '<div class="row-sub">' + icon('bed',13) + ' Room ' + esc(room ? room.roomNumber : '-') + '</div>' +

      '<div class="row-right">' + statusPill(c.status) +

function openReminderSheet(tenantIds, type){

/* ----------------------------------------------------------------
   31. EVENT HANDLING
   ---------------------------------------------------------------- */
document.addEventListener('click', function(e){
  // Drawer backdrop
  const backdrop = e.target.closest('.drawer-backdrop');
  if(backdrop && !e.target.closest('.drawer')){
    closeDrawer();
    return;
  }
  const sheetBackdrop = e.target.closest('.sheet-backdrop');
  if(sheetBackdrop && !e.target.closest('.sheet')){
    closeSheet();
    return;
  }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'noop': e.preventDefault(); break;

    case 'open-drawer': openDrawer(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'close-sheet': closeSheet(); break;
    case 'back': back(); break;

    case 'go': {
      if(el.dataset.patch){
        try{
          const patch = JSON.parse(el.dataset.patch);
          Object.keys(patch).forEach(function(k){ UI[k] = patch[k]; });
        }catch(err){}
      }
      navigate(el.dataset.screen, { id: el.dataset.id });
      break;
    }

    case 'filter': {
      UI[el.dataset.group] = el.dataset.value;
      render();
      break;
    }

    case 'fin-tab': {
      UI.finTab = el.dataset.value;
      render();
      break;
    }

    case 'fin-filter': {
      const group = el.dataset.group;
      if(group === 'finTenant'){
        if(UI.finTenant === 'all'){
          // cycle through tenants
          openFinTenantPicker();
        } else {
          UI.finTenant = 'all'; render();
        }
      } else if(group === 'finRoom'){
        if(UI.finRoom === 'all'){
          openFinRoomPicker();
        } else {
          UI.finRoom = 'all'; render();
        }
      } else if(group === 'finStatus'){
        const order = ['all','paid','partial','unpaid'];
        const idx = order.indexOf(UI.finStatus);
        UI.finStatus = order[(idx+1) % order.length];
        render();
      }
      break;
    }

    case 'month': {
      UI.month = shiftMonth(UI.month, parseInt(el.dataset.delta,10));
      if(UI.screen === 'financial') render();
      else render();
      break;
    }

    // ---- Record payment ----
    case 'open-payment': {
      openPaymentSheet(el.dataset.id, UI.month, el.dataset.type || 'rent');
      break;
    }
    case 'sheet-type': {
      if(UI.sheet && UI.sheet.kind === 'payment'){
        UI.sheet.type = el.dataset.value;
        renderPaymentSheet();
      }
      break;
    }
    case 'save-payment': {
      handleSavePayment(el.dataset.id);
      break;
    }

    // ---- Reminders ----
    case 'open-reminder': {
      openReminderSheet([el.dataset.id], el.dataset.type);
      break;
    }
    case 'open-bulk-reminder': {
      const m = UI.month;
      let ids;
      if(el.dataset.type === 'electricity'){
        ids = DB.tenants.filter(function(t){ return calculateElectricityDue(t, m) > 0; }).map(function(t){ return t.id; });
      } else {
        ids = DB.tenants.filter(function(t){ return tenantTotalDue(t, m) > 0; }).map(function(t){ return t.id; });
      }
      if(!ids.length){
        showToast('No pending dues to remind', 'info');
        break;
      }
      openReminderSheet(ids, el.dataset.type);
      break;
    }
    case 'default-message': {
      const ta = document.getElementById('reminder-message');
      if(ta) ta.value = 'Your hostel payment is pending for ' + monthLabel(UI.month) + '. Please clear your due amount at the earliest. If you have already paid, kindly ignore this message.';
      break;
    }
    case 'send-reminder': {
      const ta = document.getElementById('reminder-message');
      const msg = ta ? ta.value : '';
      const s = UI.sheet;
      if(s && s.kind === 'reminder'){
        DB.reminders.push({
          id:'reminder_' + Date.now(),
          tenantIds: s.tenantIds.slice(),
          month: UI.month,
          message: msg,
          sentAt: new Date().toISOString(),
          simulated: true
        });
        saveData();
        showToast('Reminder prepared for ' + s.tenantIds.length + ' tenant' + (s.tenantIds.length===1?'':'s'), 'success');
      }
      closeSheet();
      break;
    }

    // ---- Electricity bill ----
    case 'open-elec-bill': {
      openElectricityBillSheet(el.dataset.id);
      break;
    }
    case 'save-elec-bill': {
      handleSaveElecBill(el.dataset.id);
      break;
    }

    // ---- Complaints ----
    case 'complaint-status': {
      const c = getComplaint(el.dataset.id);
      if(!c) break;
      c.status = el.dataset.value;
      saveData();
      const labels = { 'open':'reopened', 'in-progress':'marked as in progress', 'resolved':'marked as resolved' };
      showToast('Complaint ' + (labels[c.status] || 'updated'), c.status === 'resolved' ? 'success' : 'info');
      render();
      break;
    }

    // ---- Hostel info edit ----
    case 'edit-hostel': {
      openHostelEditSheet(el.dataset.section);
      break;
    }

    // ---- Delete ----
    case 'delete-tenant': {
      const t = getTenant(el.dataset.id);
      if(!t) break;
      confirmDialog('Delete tenant?', 'This will remove ' + t.name + ' and cannot be undone. Payment records will be kept.', 'Delete', true)
        .then(function(ok){
          if(!ok) return;
          DB.tenants = DB.tenants.filter(function(x){ return x.id !== t.id; });
          DB.complaints = DB.complaints.filter(function(c){ return c.tenantId !== t.id; });
          saveData();
          showToast('Tenant deleted', 'success');
          UI.screen = 'tenants';
          render();
        });
      break;
    }
    case 'delete-room': {
      const r = getRoom(el.dataset.id);
      if(!r) break;
      const occ = roomOccupants(r.id).length;
      if(occ > 0){
        showToast('Cannot delete a room with tenants', 'error');
        break;
      }
      confirmDialog('Delete room?', 'Room ' + r.roomNumber + ' will be permanently removed.', 'Delete', true)
        .then(function(ok){
          if(!ok) return;
          DB.rooms = DB.rooms.filter(function(x){ return x.id !== r.id; });
          DB.electricity = DB.electricity.filter(function(x){ return x.roomId !== r.id; });
          saveData();
          showToast('Room deleted', 'success');
          UI.screen = 'rooms';
          render();
        });
      break;
    }

    // ---- Logout ----
    case 'logout': {
      confirmDialog('Logout?', 'You will need to sign in again to access your hostel.', 'Logout', true)
        .then(function(ok){
          if(!ok) return;
          closeDrawer();
          clearAuth();
          render();
          showToast('Signed out', 'info');
        });
      break;
    }

    default: break;
  }
});

/* ---- Search inputs ---- */
document.addEventListener('input', function(e){
  const key = e.target.dataset.search;
  if(key){
    UI[key] = e.target.value;
    const pos = e.target.selectionStart;
    const val = e.target.value;
    render();
    const again = document.querySelector('[data-search="' + key + '"]');
    if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(err){} }
    return;
  }
  if(e.target.id === 'pay-amount'){
    const due = parseFloat(e.target.dataset.due) || 0;
    const amt = parseFloat(e.target.value) || 0;
    const rem = document.getElementById('pay-remaining');
    if(rem){
      const val = Math.max(0, r2(due - amt));
      rem.textContent = money(val);
      rem.style.color = amt > due ? 'var(--red)' : 'var(--green)';
    }
  }
  if(e.target.id === 'bill-amount'){
    const s = UI.sheet;
    if(s && s.kind === 'elec-bill'){
      const occ = roomOccupants(s.roomId).length;
      const val = parseFloat(e.target.value) || 0;
      const shareEl = document.getElementById('bill-share');
      if(shareEl) shareEl.textContent = occ ? money(val / occ) : money(0);
    }
  }
});

/* ---- Form submissions ---- */
document.addEventListener('submit', function(e){
  const form = e.target;

  /* LOGIN */
  if(form.id === 'login-form'){
    e.preventDefault();
    const input = document.getElementById('login-phone');
    const err = document.getElementById('login-err');
    const digits = (input.value || '').replace(/\D/g,'');
    if(digits.length !== 10){
      err.textContent = 'Enter a valid 10-digit mobile number.';
      err.style.display = 'block';
      input.focus();
      return;
    }
    err.style.display = 'none';
    const btn = document.getElementById('login-btn');
    btn.innerHTML = 'Signing in...';
    btn.disabled = true;
    setTimeout(function(){
      session = { authed:true, phone:'+91 ' + digits };
      saveAuth();
      UI.screen = 'home';
      UI.stack = [];
      render();
      showToast('Welcome back to HS Height', 'success');
    }, 500);
    return;
  }

  /* TENANT FORM */
  if(form.id === 'tenant-form'){
    e.preventDefault();
    handleTenantSubmit(form);
    return;
  }

  /* ROOM FORM */
  if(form.id === 'room-form'){
    e.preventDefault();
    handleRoomSubmit(form);
    return;
  }

  /* COMPLAINT FORM */
  if(form.id === 'complaint-form'){
    e.preventDefault();
    const title = document.getElementById('cf-title').value;
    const tenantId = document.getElementById('cf-tenant').value;
    const desc = document.getElementById('cf-desc').value.trim();
    const errEl = document.getElementById('complaint-form-err');
    if(!desc){
      errEl.textContent = 'Please describe the issue.';
      errEl.style.display = 'block';
      return;
    }
    const t = getTenant(tenantId);
    const num = 13 + DB.complaints.length;
    const c = {
      id: 'C-' + String(num).padStart(3,'0'),
      title: title,
      tenantId: tenantId,
      roomId: t ? t.roomId : null,
      description: desc,
      status: 'open',
      createdAt: '2026-10-15T13:00:00',
      icon: 'wrench',
      tone: 'red'
    };
    DB.complaints.push(c);
    saveData();
    showToast('Complaint submitted successfully', 'success');
    navigate('complaint-details', { id: c.id });
    return;
  }

  /* ADMIN PROFILE */
  if(form.id === 'admin-form'){
    e.preventDefault();
    const name = document.getElementById('af-name').value.trim();
    const phoneDigits = (document.getElementById('af-phone').value || '').replace(/\D/g,'');
    const email = document.getElementById('af-email').value.trim();
    const errEl = document.getElementById('admin-form-err');
    if(!name){ errEl.textContent = 'Enter admin name.'; errEl.style.display='block'; return; }
    if(phoneDigits.length !== 10){ errEl.textContent = 'Enter a valid 10-digit mobile number.'; errEl.style.display='block'; return; }
    errEl.style.display = 'none';
    DB.admin.name = name;
    DB.admin.phone = '+91 ' + phoneDigits;
    DB.admin.email = email;
    saveData();
    showToast('Admin profile updated', 'success');
    render();
    return;
  }

  /* HOSTEL EDIT */
  if(form.id === 'hostel-edit-form'){
    e.preventDefault();
    const section = form.dataset.section;
    const fd = new FormData(form);
    if(section === 'basic'){
      DB.hostel.name = (fd.get('name') || '').toString().trim() || DB.hostel.name;
      DB.hostel.address = (fd.get('address') || '').toString();
      DB.hostel.ownerName = (fd.get('ownerName') || '').toString().trim();
      DB.hostel.contact = (fd.get('contact') || '').toString().trim();
    } else if(section === 'details'){
      const rr = parseFloat(fd.get('defaultRoomRent'));
      const tr = parseFloat(fd.get('defaultTenantRent'));
      if(!isNaN(rr) && rr > 0) DB.hostel.defaultRoomRent = rr;
      if(!isNaN(tr) && tr > 0) DB.hostel.defaultTenantRent = tr;
    } else {
      DB.hostel.notes = (fd.get('notes') || '').toString();
    }
    saveData();
    closeSheet();
    showToast('Hostel information updated', 'success');
    render();
    return;
  }
});

/* ---- Tenant submit ---- */
function handleTenantSubmit(form){
  const mode = form.dataset.mode;
  const id = form.dataset.id;
  const errEl = document.getElementById('tenant-form-err');
  const name = document.getElementById('tf-name').value.trim();
  const phoneDigits = (document.getElementById('tf-phone').value || '').replace(/\D/g,'');
  const roomId = document.getElementById('tf-room').value;
  const rent = parseFloat(document.getElementById('tf-rent').value);
  const joining = document.getElementById('tf-join').value;

  function fail(msg){ errEl.textContent = msg; errEl.style.display = 'block'; window.scrollTo(0,0); }

  if(!name) return fail('Please enter the full name.');
  if(phoneDigits.length !== 10) return fail('Enter a valid 10-digit mobile number.');
  if(!roomId) return fail('Please select a room number.');
  if(isNaN(rent) || rent <= 0) return fail('Enter a valid rent amount.');
  if(!joining) return fail('Please select the date of joining.');

  const room = getRoom(roomId);
  if(!room) return fail('Selected room was not found.');

  const occ = roomOccupants(roomId);
  const isEditingSameRoom = mode === 'edit' && getTenant(id) && getTenant(id).roomId === roomId;

  if(!isEditingSameRoom && occ.length >= room.capacity){
    return fail('This room is already full. Maximum occupancy is 3 tenants.');
  }

  errEl.style.display = 'none';

  if(mode === 'edit'){
    const t = getTenant(id);
    if(!t) return;
    const oldRoomId = t.roomId;
    t.name = name;
    t.phone = '+91 ' + phoneDigits;
    t.roomId = roomId;
    t.monthlyRent = rent;
    t.joiningDate = joining;
    // Keep complaints room in sync
    DB.complaints.forEach(function(c){ if(c.tenantId === t.id) c.roomId = roomId; });
    saveData();
    showToast('Tenant updated successfully', 'success');
    navigate('tenant-details', { id: t.id }, { replace:true });
  } else {
    const newId = 'tenant_' + Date.now();
    const t = {
      id: newId,
      name: name,
      phone: '+91 ' + phoneDigits,
      roomId: roomId,
      monthlyRent: rent,
      joiningDate: joining
    };
    DB.tenants.push(t);
    saveData();
    showToast('Tenant added successfully', 'success');
    navigate('tenant-details', { id: newId }, { replace:true });
  }
  render();
}

/* ---- Room submit ---- */
function handleRoomSubmit(form){
  const mode = form.dataset.mode;
  const id = form.dataset.id;
  const errEl = document.getElementById('room-form-err');
  const num = document.getElementById('rf-number').value.trim();
  const capacity = parseInt(document.getElementById('rf-capacity').value, 10);
  const roomRent = parseFloat(document.getElementById('rf-room-rent').value);
  const tenantRent = parseFloat(document.getElementById('rf-tenant-rent').value);
  const type = document.getElementById('rf-type').value;

  function fail(msg){ errEl.textContent = msg; errEl.style.display = 'block'; window.scrollTo(0,0); }

  if(!num) return fail('Please enter a room number.');
  if(isNaN(roomRent) || roomRent <= 0) return fail('Enter a valid room rent amount.');
  if(isNaN(tenantRent) || tenantRent <= 0) return fail('Enter a valid tenant rent amount.');
  if(capacity > 3) return fail('Maximum occupancy is 3 tenants.');

  const dup = DB.rooms.find(function(r){ return r.roomNumber === num && r.id !== id; });
  if(dup) return fail('A room with this number already exists.');

  errEl.style.display = 'none';

  if(mode === 'edit'){
    const r = getRoom(id);
    if(!r) return;
    if(capacity < roomOccupants(r.id).length){
      return fail('Occupancy cannot be less than the current number of tenants.');
    }
    r.roomNumber = num;
    r.capacity = capacity;
    r.monthlyRent = roomRent;
    r.type = type;
    saveData();
    showToast('Room updated successfully', 'success');
    navigate('room-details', { id: r.id }, { replace:true });
  } else {
    const newId = 'room_' + num + '_' + Date.now();
    const r = { id:newId, roomNumber:num, capacity:capacity, type:type, monthlyRent:roomRent };
    DB.rooms.push(r);
    saveData();
    showToast('Room added successfully', 'success');
    navigate('room-details', { id: newId }, { replace:true });
  }
  render();
}

/* ---- Save payment ---- */
function handleSavePayment(tenantId){
  const s = UI.sheet;
  if(!s || s.kind !== 'payment') return;
  const t = getTenant(tenantId);
  if(!t) return;
  const m = s.month;
  const type = s.type;
  const amount = parseFloat(document.getElementById('pay-amount').value);
  const date = document.getElementById('pay-date').value;
  const mode = document.getElementById('pay-mode').value;
  const note = document.getElementById('pay-note').value.trim();

  const due = type === 'rent' ? calculateRentDue(t, m) : calculateElectricityDue(t, m);

  if(isNaN(amount) || amount <= 0){
    showToast('Enter a valid payment amount', 'error');
    return;
  }
  if(amount > due + 0.009){
    showToast('Payment cannot exceed the remaining due amount of ' + money(due), 'error');
    return;
  }
  if(!date){
    showToast('Please select the payment date', 'error');
    return;
  }

  DB.payments.push({
    id: 'payment_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    tenantId: t.id,
    roomId: t.roomId,
    type: type,
    month: m,
    amount: r2(amount),
    date: date,
    mode: mode,
    note: note
  });
  saveData();
  closeSheet();
  showToast('Payment recorded successfully', 'success');
  render();
}

/* ---- Save electricity bill ---- */
function handleSaveElecBill(roomId){
  const input = document.getElementById('bill-amount');
  const errEl = document.getElementById('bill-err');
  const val = parseFloat(input.value);
  if(isNaN(val) || val < 0){
    errEl.textContent = 'Enter a valid electricity bill amount.';
    errEl.style.display = 'block';
    return;
  }
  const m = UI.month;
  let rec = elecRecord(roomId, m);
  if(rec){
    rec.totalBill = r2(val);
  } else {
    const r = getRoom(roomId);
    DB.electricity.push({
      id: 'electricity_' + (r ? r.roomNumber : roomId) + '_' + m.replace('-','_'),
      roomId: roomId,
      month: m,
      totalBill: r2(val)
    });
  }
  saveData();
  closeSheet();
  showToast('Electricity bill updated successfully', 'success');
  render();
}

/* ---- Export CSV ---- */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action="export"]');
  if(!el) return;
  exportCSV();
});

function exportCSV(){
  const m = UI.month;
  const type = UI.finTab === 'rent' ? 'rent' : 'electricity';
  let rows = DB.payments.filter(function(p){ return p.month === m && p.type === type; });

  if(UI.finTenant !== 'all') rows = rows.filter(function(p){ return p.tenantId === UI.finTenant; });
  if(UI.finRoom !== 'all') rows = rows.filter(function(p){ return p.roomId === UI.finRoom; });
  rows = rows.sort(function(a,b){ return a.date.localeCompare(b.date); });

  const header = ['Payment ID','Date','Tenant','Phone','Room','Type','Month','Amount','Payment Mode','Note'];
  const lines = [header];

  rows.forEach(function(p){
    const t = getTenant(p.tenantId);
    const room = getRoom(p.roomId);
    lines.push([
      p.id,
      p.date,
      t ? t.name : '',
      t ? t.phone : '',
      room ? room.roomNumber : '',
      p.type,
      monthLabel(p.month),
      p.amount,
      p.mode,
      p.note || ''
    ]);
  });

  // Summary rows
  const total = rows.reduce(function(s,p){ return s + p.amount; }, 0);
  lines.push([]);
  lines.push(['','','','','','','TOTAL', r2(total),'','']);

  const csv = lines.map(function(r){
    return r.map(function(c){
      const v = String(c == null ? '' : c);
      return '"' + v.replace(/"/g,'""') + '"';
    }).join(',');
  }).join('\r\n');

  const blob = new Blob(['\uFEFF' + csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hs-height-' + type + '-' + m + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);

  showToast('CSV exported (' + rows.length + ' records)', 'success');
}
