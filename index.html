<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0D63F3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HS Height">
  <meta name="application-name" content="HS Height">
  <meta name="description" content="Hostel management application for managing tenants, rent, electricity and hostel records.">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>HS Height — Hostel Management</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register the service worker only when the page is served from a
    // supported origin (HTTPS or localhost). This keeps local file testing
    // from throwing confusing service-worker errors.
    if ("serviceWorker" in navigator &&
        (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" })
          .then(registration => console.log("HS Height service worker registered:", registration.scope))
          .catch(error => console.error("HS Height service worker registration failed:", error));
      });
    }
  </script>
</body>
</html>
